name: "Stratorama"
version: "0.1.6"
slug: "stratorama"
description: "Your home's floor plan, with its devices on it, inside Home Assistant: the drawing and everything it shows stay in your home."
url: "https://github.com/stratorama/stratorama-addon"
# Built where its code is, which is closed (stratorama-app/docs/design/local-mode/README.md, 6.4 and
# section 10, question 3): this folder holds only what Home Assistant reads.
image: "ghcr.io/stratorama/{arch}-stratorama"
arch:
  - aarch64
  - amd64
stage: experimental

# s6 is the base image's init: the main program (run.sh in the image) starts the local server and
# the agent, and stops the app when either ends.
init: false
startup: application
boot: auto

# Opened from Home Assistant's sidebar, which the app turns on for itself at its first start. Every
# Home Assistant user may open it: their rights in Stratorama start from Home Assistant's administrator
# flag at their first visit, then the owner manages them (the owner's decision of 2026-10-27).
ingress: true
ingress_port: 8099
panel_icon: "mdi:floor-plan"
panel_title: "Stratorama"
panel_admin: false

# The agent's token, which only the agent's process receives, and the Supervisor's own API for the
# version check and the sidebar entry.
homeassistant_api: true

watchdog: "http://[HOST]:[PORT:8099]/api/health"

# The database is written while it runs, so the backup takes a consistent copy (written beside it
# by the server, then saved) and leaves the live folder out.
backup: hot
backup_pre: "curl -fsS --max-time 60 -X POST http://127.0.0.1:8100/backup"
backup_exclude:
  - "db"
