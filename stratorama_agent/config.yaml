name: "Stratorama - Agent"
version: "1.0.0"
slug: "stratorama_agent"
description: "Connects your Home Assistant to Stratorama through one outbound, encrypted connection - no open port, no exposed instance."
url: "https://github.com/stratorama/stratorama-addon"
image: "ghcr.io/stratorama/{arch}-stratorama-agent"
arch:
  - aarch64
  - amd64

# Allow the add-on to call the local Home Assistant Core API.
# This auto-injects SUPERVISOR_TOKEN and exposes http://supervisor/core
# (REST) and ws://supervisor/core/api/websocket (WS).
homeassistant_api: true

# Outbound network only - no port to expose.
host_network: false

# Persistent /data/ across restarts/upgrades - used to store the agent token.
options:
  pairing_code: ""
  tunnel_url: "wss://stratorama.app/agent"

schema:
  pairing_code: "str?"
  tunnel_url: "url"

# Labels and help text for the two options live in translations/en.yaml.
init: false
boot: auto
startup: services
